<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <title>todo-list</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <header>
        <h1>Список задач</h1>
    </header>

    <main>
        
        <section id="new_task">
            <h2>Новая задача</h2>
            <form action="#" class="new_task_form">
                <input type="task" placeholder="Название задачи..." required>
                <button type="create">+ Добавить</button>
            </form>
        </section>

        <section id="desk">
            <div class="backlog">
                <h2>Бэклог</h2>
                <ul>
                    <li>Выучить JS</li>
                    <li>Выучить React</li>
                    <li>Сделать домашку</li>
                </ul>
            </div>

            <div class="InProcess">
                <h2>В процессе</h2>
                <ul>
                    <li>Выпить смузи</li>
                    <li>Попить воды</li>
                </ul>
            </div>

            <div class="Completed">
                <h2>Готово</h2>
                <ul>
                    <li>Позвонить маме</li>
                    <li>Погладить кота</li>
                </ul>
            </div>
            
            <div class="Trash">
                <h2>Корзина</h2>
                <ul>
                    <li>Сходить погулять</li>
                    <li>Прочитать Войну и Мир</li>
                </ul>
                <button class="clear">X Очистить</button>
            </div>
        </section>
    </main>
</body>
</html>
